# Deploys the FastAPI backend on Render's free tier.
#
# DEMO_MODE defaults to "offline": the app serves only pre-cached LLM
# responses from fixtures/llm_cache/ and never calls the Anthropic API, so no
# API key is needed at all for judges to see a working demo. To switch to live
# mode, add ANTHROPIC_API_KEY directly in the Render dashboard; it is
# intentionally not declared or stored in this file.
services:
  - type: web
    name: aims-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEMO_MODE
        value: offline
      - key: ALLOWED_ORIGINS
        value: "*"
